<style>
.nf{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 20px;gap:0}
.nf-logo{width:96px;height:96px;border-radius:26px;background:#000;border:3px solid var(--border);box-shadow:5px 5px 0 var(--border);overflow:hidden;position:relative;margin-bottom:22px}
.nf-logo img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}
.nf-code{font-family:'Nunito';font-weight:900;font-size:clamp(5rem,18vw,9rem);letter-spacing:-4px;line-height:1;background:linear-gradient(135deg,var(--yellow),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.nf h1{font-size:clamp(1.4rem,4vw,2rem);margin:10px 0 8px}
.nf p{color:var(--muted);font-weight:500;margin-bottom:26px}
.nf-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>

<header class="nav">
  <div class="container nav-inner">
    <a href="index.html" class="logo">
      <span class="logo-badge logo-img">G<img src="gravelogo.png" alt="" onerror="this.remove()"></span>
      GraveBOT
    </a>
    <div class="nav-actions">
      <a href="https://discord.gg/HMYDcAjWmX" target="_blank" class="btn btn-white btn-sm">Destek</a>

    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Karanlık mod">
      <svg class="ic-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="ic-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
    </button>
  </div>
</header>

<div class="container nf">
  <span class="nf-logo">G<img src="gravelogo.png" alt="" onerror="this.remove()"></span>

    </div>
  </div>
</footer>

<script>
(function () {
  var root = document.documentElement;
  try { var t = localStorage.getItem('grave-theme'); if (t) root.setAttribute('data-theme', t); } catch (e) {}
  function setTheme(t) { root.setAttribute('data-theme', t); try { localStorage.setItem('grave-theme', t); } catch (e) {} }
  window.oncontextmenu = () => false;
  document.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); }, true);
  document.addEventListener('keydown', e => {
    const k = e.key.toUpperCase();
    const mod = e.ctrlKey || e.metaKey;
    if (e.key === 'F12') { e.preventDefault(); return; }
    if ((mod && e.shiftKey && ['I', 'J', 'C', 'K', 'E', 'S'].includes(k)) ||
        (mod && !e.shiftKey && ['U', 'S', 'P'].includes(k))) e.preventDefault();
  });
  document.getElementById('themeToggle').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    if (document.startViewTransition) document.startViewTransition(function () { setTheme(next); });
    else setTheme(next);
  });
})();
</script>
</body>
</html>
