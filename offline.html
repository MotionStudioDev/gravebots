<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFC800">
<meta http-equiv="refresh" content="6">
<title>Çevrimdışısın — GraveBOT</title>
<link rel="icon" href="gravelogo.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FFF6E9;color:#1E2442;font-family:system-ui,-apple-system,sans-serif;padding:24px}
.card{background:#fff;border:2.5px solid #1E2442;border-radius:24px;box-shadow:6px 6px 0 #1E2442;padding:44px 32px;text-align:center;max-width:380px}
.card img{width:72px;height:72px;border-radius:20px;background:#000}
.card h1{font-size:1.6rem;margin:16px 0 8px}
.card p{color:#5B6383;font-weight:500}
.card .en{font-size:.85rem;margin-top:6px;opacity:.8}
.btn{display:inline-block;margin-top:22px;padding:12px 30px;border-radius:999px;background:#FFC800;color:#1E2442;font-weight:800;text-decoration:none;border:2px solid #1E2442;box-shadow:3px 3px 0 #1E2442}
@media(prefers-color-scheme:dark){body{background:#12141F;color:#F1F3F9}.card{background:#1A1F30;border-color:rgba(255,255,255,.14);box-shadow:6px 6px 0 rgba(0,0,0,.5)}.card p{color:#9AA3B5}.btn{color:#1E2442}}
</style>
</head>
<body>
<main class="card">
<img src="gravelogo.png" alt="GraveBOT" width="72" height="72">
<h1>Çevrimdışısın</h1>
<p>İnternet bağlantın yok. Bağlantı dönünce bu sayfa kendini yenileyecek.</p>
<p class="en">You're offline. This page reloads itself when you're back.</p>
<a class="btn" href="index.html">Tekrar Dene</a>
</main>
</body>
</html>
